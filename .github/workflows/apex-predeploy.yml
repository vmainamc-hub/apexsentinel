name: Apex Sentinel pre-deployment verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:functions
      - run: npm test --workspace trading-bot-template -- --runInBand src/pages/best-bots src/components/shared/utils/config