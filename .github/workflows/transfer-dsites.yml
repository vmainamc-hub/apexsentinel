name: Transfer Dsites platform into Apex Sentinel

on:
  push:
    branches:
      - full-dsites-independent-transfer

permissions:
  contents: write

jobs:
  transfer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Apex Sentinel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Dsites source
        run: git clone --depth 1 https://github.com/DukeNyamasege/Full-Dsites-code.git /tmp/full-dsites

      - name: Replace Apex tree with independent Dsites source
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/full-dsites/. .
          rm -rf repo-push-new-user-interface
          rm -rf .git
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin full-dsites-independent-transfer
          git checkout -B full-dsites-independent-transfer FETCH_HEAD
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Transfer complete Dsites platform into Apex Sentinel" || exit 0
          git push origin HEAD:full-dsites-independent-transfer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
