name: Verify DBot shutdown repair

on:
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'jest.config.ts'
      - 'playwright.config.ts'
      - 'tests/browser/**'
      - 'src/external/bot-skeleton/services/tradeEngine/utils/interpreter.js'
      - 'src/external/bot-skeleton/services/tradeEngine/trade/Ticks.js'
      - 'src/external/bot-skeleton/scratch/dbot.js'
      - 'src/external/bot-skeleton/scratch/__tests__/dbot-lifecycle.runtime.spec.js'
      - 'src/app/app-content.jsx'
      - 'src/components/layout/header/header.tsx'
      - 'src/components/layout/app-logo/**'
      - 'src/pages/dashboard/announcements/announcements.tsx'
      - 'src/pages/dashboard/announcements/config.tsx'
      - 'src/pages/main/**'
      - 'src/pages/bot-builder/**'
      - 'src/pages/bot-store/**'
      - 'src/components/bot-store/**'
      - 'src/components/run-panel/**'
      - 'src/components/trade-animation/**'
      - 'src/components/shared_ui/tabs/**'
      - 'src/components/shared_ui/drawer/**'
      - 'src/constants/bot-contents.ts'
      - '.github/workflows/repair-dbot-shutdown.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies and generate lockfile
        run: npm install --no-audit --no-fund

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock npm dependencies"
            git push
          fi

      - name: DBot lifecycle runtime regression
        run: npx jest src/external/bot-skeleton/scratch/__tests__/dbot-lifecycle.runtime.spec.js --runInBand

      - name: Type check
        run: npm run type-check

      - name: Production build
        run: npm run build

      - name: Install Playwright test runner and Chromium
        run: |
          npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Mobile browser regression
        run: npx playwright test
