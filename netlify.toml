[build]
  command = "npm ci && npm run build:trading-web"
  publish = "new-user-interface-main/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  HUSKY = "0"

# Same-origin Deriv trader BFF (Netlify Functions, no external platform).
[[redirects]]
  from = "/api/deriv-oauth-start"
  to = "/.netlify/functions/deriv-auth/oauth-start"
  status = 200
  force = true

[[redirects]]
  from = "/api/deriv-oauth-callback"
  to = "/.netlify/functions/deriv-auth/oauth-callback"
  status = 200
  force = true

[[redirects]]
  from = "/api/deriv-trader-session"
  to = "/.netlify/functions/deriv-auth/trader-session"
  status = 200
  force = true

[[redirects]]
  from = "/api/deriv-trader-accounts"
  to = "/.netlify/functions/deriv-auth/trader-accounts"
  status = 200
  force = true

[[redirects]]
  from = "/api/deriv-trader-otp"
  to = "/.netlify/functions/deriv-auth/trader-otp"
  status = 200
  force = true

# Bot ideas, best-bot statistics and scanner -> Express/PostgreSQL backend (BACKEND_URL).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://auth.deriv.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://survey.survicate.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api.derivws.com wss://api.derivws.com https://survey.survicate.com; frame-src https://*.deriv.com https://drive.google.com; worker-src 'self' blob:; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
