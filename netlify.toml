# Apex Sentinel — standalone customer trading site.
# Runtime path: GitHub -> Netlify -> Apex Sentinel -> Deriv.
[build]
  command = "npm ci && npm run build"
  publish = "new-user-interface-main/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  HUSKY = "0"

[functions]
  node_bundler = "esbuild"

# Same-origin Deriv trader BFF.
[[redirects]]
  from = "/api/deriv-oauth-start"
  to = "/.netlify/functions/deriv-auth/oauth-start"
  status = 200
  force = true
[[redirects]]
  from = "/api/deriv-oauth-callback"
  to = "/.netlify/functions/deriv-auth/oauth-callback"
  status = 200
  force = true
[[redirects]]
  from = "/api/deriv-trader-session"
  to = "/.netlify/functions/deriv-auth/trader-session"
  status = 200
  force = true
[[redirects]]
  from = "/api/deriv-trader-accounts"
  to = "/.netlify/functions/deriv-auth/trader-accounts"
  status = 200
  force = true
[[redirects]]
  from = "/api/deriv-trader-otp"
  to = "/.netlify/functions/deriv-auth/trader-otp"
  status = 200
  force = true

# Optional Express/PostgreSQL backend for bot ideas, best-bot stats and scanner.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://auth.deriv.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://survey.survicate.com https://www.googletagmanager.com https://www.google-analytics.com https://www.googleadservices.com https://googleads.g.doubleclick.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.derivws.com wss://api.derivws.com https://charts.deriv.com https://api.binarytool.site https://www.google.com https://www.google-analytics.com https://analytics.google.com https://www.googleadservices.com https://ad.doubleclick.net https://cdn.jsdelivr.net; frame-src https://*.deriv.com https://charts.deriv.com https://api.binarytool.site; worker-src 'self' blob:; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
